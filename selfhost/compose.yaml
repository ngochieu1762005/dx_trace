services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80","443:443"]
    environment:
      APP_HOST: ${APP_HOST:?}
      ID_HOST: ${ID_HOST:?}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro","tls:/data"]
    networks: [edge, appnet]
  identitydb:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes: ["identitydata:/var/lib/postgresql/data"]
    networks: [dbnet]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U keycloak -d identity"]
      interval: 5s
      timeout: 5s
      retries: 20
  identity:
    image: quay.io/keycloak/keycloak:26.4.7
    restart: unless-stopped
    command: ["start","--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identitydb:5432/identity
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      KC_HOSTNAME: https://${ID_HOST:?}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      APP_HOST: ${APP_HOST:?}
    volumes: ["./realm.json:/opt/keycloak/data/import/warehouse.json:ro"]
    depends_on:
      identitydb:
        condition: service_healthy
    networks: [edge, dbnet]
  signin:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://${ID_HOST:?}/realms/warehouse
      OAUTH2_PROXY_CLIENT_ID: dx-trace
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET:?}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_USER_ID_CLAIM: sub
      OAUTH2_PROXY_SCOPE: "openid email profile"
      OAUTH2_PROXY_REDIRECT_URL: https://${APP_HOST:?}/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://app:8080/
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_PASS_BASIC_AUTH: "false"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
    networks: [edge, appnet]
  # API / identity domain: only the web application can reach the core.
  core:
    build: {context: "..", dockerfile: selfhost/Dockerfile}
    restart: unless-stopped
    command: ["node", "selfhost/core-server.mjs"]
    environment:
      PUBLIC_ORIGIN: https://${APP_HOST:?}
      DX_CORE_TOKEN: ${DX_CORE_TOKEN:?}
      PORT: "8081"
      BIND_ADDRESS: 0.0.0.0
    volumes: ["warehouse:/app/data"]
    networks: [corenet]
  # Presentation-only application: no warehouse volume or direct database access.
  app:
    build: {context: "..", dockerfile: selfhost/Dockerfile}
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${APP_HOST:?}
      DX_CORE_URL: http://core:8081
      DX_CORE_TOKEN: ${DX_CORE_TOKEN:?}
    networks: [appnet, corenet]
    depends_on: [core]
volumes: {tls: {}, identitydata: {}, warehouse: {}}
networks: {edge: {}, appnet: {}, corenet: {}, dbnet: {internal: true}}
