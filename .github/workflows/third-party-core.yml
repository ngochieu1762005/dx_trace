# SPDX-License-Identifier: MIT
name: Third-party core acceptance
on:
  pull_request:
    paths:
      - 'selfhost/compose.yaml'
      - 'selfhost/compose.third-party.yaml'
      - 'selfhost/compose.sso-test.yaml'
      - 'selfhost/compose.evidence-test.yaml'
      - 'selfhost/migrate-evidence.mjs'
      - 'selfhost/scripts/*sso*'
      - 'lib/**'
      - 'apps/model-portal/**'
      - 'drizzle/**'
      - 'selfhost/runtime.mjs'
      - 'app/api/**'
      - 'examples/**'
      - 'docs/olp-compliance.md'
      - 'tools/archive-sensors.mjs'
      - 'tools/verify-stack.mjs'
      - 'tools/sensor-client.mjs'
      - 'tests/cold-archive.test.mjs'
      - 'selfhost/apisix/**'
      - 'selfhost/flowable/**'
      - 'selfhost/scripts/third-party-smoke.mjs'
      - '.github/workflows/third-party-core.yml'
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: false
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: selfhost
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Generate disposable credentials
        shell: bash
        run: |
          umask 077
          printf '%s\n' APP_HOST=app.example.invalid ID_HOST=id.example.invalid > .env
          for key in DB_PASSWORD ADMIN_PASSWORD OIDC_CLIENT_SECRET DX_CORE_TOKEN DX_GATEWAY_APP_TOKEN DX_FLOWABLE_DB_PASSWORD DX_FLOWABLE_API_PASSWORD; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> .env
          done
          cookie_value="$(openssl rand -base64 32 | tr '+/' '-_')"
          echo "::add-mask::$cookie_value"
          printf 'COOKIE_SECRET=%s\n' "$cookie_value" >> .env
      - name: Set up Node for governance checks
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Git-declared topology and cold archive
        run: |
          node ../tools/verify-stack.mjs -f compose.yaml -f compose.third-party.yaml
          node --test ../tests/cold-archive.test.mjs
          node --check ../tools/sensor-client.mjs
      - name: Provision disposable evidence signing material
        run: |
          node ../tools/evidence-cli.mjs keygen --out .evidence-test
          sudo chown 1000:1000 .evidence-test/evidence-private.pem
      - name: Validate and start isolated services
        run: |
          docker compose -p dxtrace-migration -f compose.yaml -f compose.third-party.yaml -f compose.evidence-test.yaml --profile migration-test config --quiet
          docker compose -p dxtrace-migration -f compose.yaml -f compose.third-party.yaml -f compose.evidence-test.yaml up -d --build core gateway-api flowable
      - name: Exercise real gateway and BPMN engine
        run: docker compose -p dxtrace-migration -f compose.yaml -f compose.third-party.yaml -f compose.evidence-test.yaml --profile migration-test run --rm migration-smoke
      - name: Verify three portals through real Keycloak and OAuth2 Proxy sessions
        run: |
          python3 -m venv "$RUNNER_TEMP/sso-venv"
          "$RUNNER_TEMP/sso-venv/bin/pip" -q install PyYAML==6.0.3
          "$RUNNER_TEMP/sso-venv/bin/python" scripts/prepare-sso-test.py
          docker compose -p dxtrace-migration -f compose.yaml -f compose.third-party.yaml -f compose.evidence-test.yaml -f compose.sso-test.yaml --profile migration-test run --rm sso-smoke
      - name: Container status on failure
        if: failure()
        run: |
          docker compose -p dxtrace-migration -f compose.yaml -f compose.third-party.yaml ps -a
          docker compose -p dxtrace-migration -f compose.yaml -f compose.third-party.yaml logs --tail=30 identity signin
      - name: Cleanup disposable stack
        if: always()
        run: |
          if test -f .env; then
            docker compose -p dxtrace-migration -f compose.yaml -f compose.third-party.yaml down -v --remove-orphans
            rm -f .env
            rm -rf .sso-test
            sudo rm -rf .evidence-test
          fi
