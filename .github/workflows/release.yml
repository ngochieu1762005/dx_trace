name: Verify and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify and publish'
        required: true
        default: 'v0.0.3'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node selfhost/build.mjs
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests -p '*_test.py'

  publish:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Package tagged source
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          git check-ref-format "refs/tags/$RELEASE_TAG"
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"

          ARCHIVE="DX-TRACE-${RELEASE_TAG}.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="DX-TRACE-${RELEASE_TAG}/" \
            -o "$ARCHIVE" \
            "refs/tags/$RELEASE_TAG"

          sha256sum "$ARCHIVE" > SHA256SUMS

      - name: Create or update release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null; then
            echo "Release $RELEASE_TAG already exists; updating assets."
          else
            if [ -f "docs/releases/RELEASE_NOTES_${RELEASE_TAG}.md" ]; then
              gh release create "$RELEASE_TAG" \
                --verify-tag \
                --title "DX-TRACE $RELEASE_TAG" \
                --notes-file "docs/releases/RELEASE_NOTES_${RELEASE_TAG}.md"
            else
              gh release create "$RELEASE_TAG" \
                --verify-tag \
                --title "DX-TRACE $RELEASE_TAG" \
                --generate-notes
            fi
          fi

          gh release upload "$RELEASE_TAG" \
            "DX-TRACE-${RELEASE_TAG}.tar.gz" \
            SHA256SUMS \
            --clobber