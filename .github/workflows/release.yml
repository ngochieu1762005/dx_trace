name: Verify and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify and publish'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node selfhost/build.mjs
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests -p '*_test.py'

  integration:
    uses: ./.github/workflows/third-party-core.yml
    with:
      checkout_ref: ${{ github.event.inputs.tag || github.ref }}

  publish:
    needs: [verify, integration]
    if: >-
      always() && needs.verify.result == 'success' &&
      needs.integration.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Package tagged source
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          git check-ref-format "refs/tags/$RELEASE_TAG"
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"

          ARCHIVE="DX-TRACE-${RELEASE_TAG}.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="DX-TRACE-${RELEASE_TAG}/" \
            -o "$ARCHIVE" \
            "refs/tags/$RELEASE_TAG"

          sha256sum "$ARCHIVE" > SHA256SUMS

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Build and run the exact release archive outside the source tree
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          bash scripts/verify-release.sh "DX-TRACE-${RELEASE_TAG}.tar.gz" | tee clean-install.log
      - uses: actions/upload-artifact@v4
        with:
          name: clean-install-evidence
          path: clean-install.log
      - name: Generate SPDX SBOM of the tagged source
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: DX-TRACE.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Verify inventory and include checksum
        run: |
          node tools/validate-sbom.mjs DX-TRACE.spdx.json
          node tools/dxtrace.mjs evidence demo --out "$RUNNER_TEMP/sample-proof" >/dev/null
          cp "$RUNNER_TEMP/sample-proof/recall-evidence.tar.gz" synthetic-recall-evidence.tar.gz
          cp "$RUNNER_TEMP/sample-proof/evidence-public.pem" sample-evidence-public.pem
          node tools/dxtrace.mjs evidence verify synthetic-recall-evidence.tar.gz --public-key sample-evidence-public.pem
          npm pack ./sdk --ignore-scripts
          sha256sum DX-TRACE.spdx.json dxtrace-sdk-*.tgz synthetic-recall-evidence.tar.gz sample-evidence-public.pem clean-install.log >> SHA256SUMS
      - name: Attest source archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: DX-TRACE-*.tar.gz
      - name: Attest SPDX SBOM for the source archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: DX-TRACE-*.tar.gz
          sbom-path: DX-TRACE.spdx.json

      - name: Create or update release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null; then
            echo "Release $RELEASE_TAG already exists; updating assets."
          else
            if [ -f "docs/releases/RELEASE_NOTES_${RELEASE_TAG}.md" ]; then
              gh release create "$RELEASE_TAG" \
                --verify-tag \
                --title "DX-TRACE $RELEASE_TAG" \
                --notes-file "docs/releases/RELEASE_NOTES_${RELEASE_TAG}.md"
            else
              gh release create "$RELEASE_TAG" \
                --verify-tag \
                --title "DX-TRACE $RELEASE_TAG" \
                --generate-notes
            fi
          fi

          gh release upload "$RELEASE_TAG" \
            "DX-TRACE-${RELEASE_TAG}.tar.gz" \
            DX-TRACE.spdx.json \
            dxtrace-sdk-*.tgz synthetic-recall-evidence.tar.gz sample-evidence-public.pem clean-install.log SHA256SUMS \
            --clobber