# DX-TRACE | One-time, source-verified v0.0.7 publication
# SPDX-License-Identifier: MIT
# Copyright (c) 2026 DX-TRACE contributors.
#
# Trigger only when the v0.0.7 release-notes file is first committed to main.
# A GitHub Actions workflow cannot assume the old tag-based release job will
# trigger from tags created by GITHUB_TOKEN. Publish assets in this job.
name: Publish DX-TRACE v0.0.7

on:
  push:
    branches: [main]
    paths:
      - docs/releases/RELEASE_NOTES_v0.0.7.md

permissions:
  contents: read

concurrency:
  group: dxtrace-v0.0.7-source-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify source and publish exact commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Verify exactly intended version and no leaked secrets
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='0.0.7') process.exit(1)"
          node tools/check-secrets.mjs
      - name: Build and test the exact source
        run: |
          set -euo pipefail
          node selfhost/build.mjs
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -p '*_test.py'
          bash -n tools/restore-drill.sh
      - name: Create source archive from immutable commit
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=DX-TRACE-v0.0.7/ \
            -o DX-TRACE-v0.0.7.tar.gz "$GITHUB_SHA"
          git archive --format=zip --prefix=DX-TRACE-v0.0.7/ \
            -o DX-TRACE-v0.0.7.zip "$GITHUB_SHA"
          sha256sum DX-TRACE-v0.0.7.tar.gz DX-TRACE-v0.0.7.zip > SHA256SUMS
      - name: Generate SPDX 2.3 SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: DX-TRACE.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Validate SBOM and hashes
        run: |
          set -euo pipefail
          node tools/validate-sbom.mjs DX-TRACE.spdx.json
          sha256sum DX-TRACE.spdx.json >> SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest source archive provenance
        uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1 # v3
        with:
          subject-path: DX-TRACE-v0.0.7.tar.gz
      - name: Attest source SPDX SBOM
        uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1 # v3
        with:
          subject-path: DX-TRACE-v0.0.7.tar.gz
          sbom-path: DX-TRACE.spdx.json
      - name: Tag and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.0.7 >/dev/null 2>&1; then
            echo 'ERROR: v0.0.7 tag already exists; refusing to move or overwrite it.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v0.0.7 "$GITHUB_SHA" -m 'DX-TRACE v0.0.7 — Parallel Workflow & External OIDC API'
          git push origin refs/tags/v0.0.7
          gh release create v0.0.7 \
            --verify-tag \
            --title 'DX-TRACE v0.0.7 — Parallel Workflow & External OIDC API' \
            --notes-file docs/releases/RELEASE_NOTES_v0.0.7.md \
            DX-TRACE-v0.0.7.tar.gz DX-TRACE-v0.0.7.zip DX-TRACE.spdx.json SHA256SUMS
          gh release view v0.0.7 --json tagName,name,isDraft,isPrerelease,assets,url
