name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: node selfhost/build.mjs
      - name: Verify evidence interaction and mobile layout in a real browser
        shell: bash
        run: |
          node selfhost/local-demo.mjs > "$RUNNER_TEMP/evidence-ui.log" 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          for i in {1..80}; do
            kill -0 "$demo_pid"
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then break; fi
            sleep .25
          done
          DX_EVIDENCE_SCREENSHOT_DIR="$RUNNER_TEMP/evidence-ui" python selfhost/scripts/evidence-browser-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-ui-screenshots
          path: |
            ${{ runner.temp }}/evidence-ui/*.png
            ${{ runner.temp }}/evidence-ui.log
  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Generate a versioned SPDX SBOM from the exact checkout
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: DX-TRACE.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - run: node tools/validate-sbom.mjs DX-TRACE.spdx.json
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Validate per-file SPDX licensing
        run: pipx run --spec reuse==6.3.0 reuse lint
      - name: Exercise a clean source archive and installed runtime
        run: |
          git archive --format=tar.gz --prefix=DX-TRACE/ -o "$RUNNER_TEMP/source.tar.gz" HEAD
          bash scripts/verify-release.sh "$RUNNER_TEMP/source.tar.gz"
      - name: Check tracked source for leaked credentials
        run: node tools/check-secrets.mjs
      - name: Validate standalone portal JavaScript syntax
        run: node --check apps/quality-portal/server.mjs && node --check apps/quality-portal/app.js
      - name: Validate external API, process timer and offline restore runner syntax
        run: node --check selfhost/external-api.mjs && node --check selfhost/process-timer.mjs && bash -n tools/restore-drill.sh && bash -n selfhost/scripts/update-ubuntu.sh && node --check selfhost/doctor.mjs
      - run: node selfhost/build.mjs
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests -p '*_test.py'
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f selfhost/Dockerfile -t dxtrace-ci .
      - name: Validate host-Caddy Compose with external OIDC API profile
        run: |
          APP_HOST=app.ci.invalid ID_HOST=id.ci.invalid \
          DB_PASSWORD=ci-only-postgres \
          ADMIN_PASSWORD=ci-only-keycloak \
          OIDC_CLIENT_SECRET=ci-only-oidc \
          COOKIE_SECRET=ci-only-cookie \
          DX_CORE_TOKEN=ci-only-core-token-secret-123456789012345678 \
          DX_GATEWAY_APP_TOKEN=ci-only-gateway-token-secret-123456789012345 \
          docker compose -f selfhost/compose.yaml -f selfhost/compose.ubuntu-edge.yaml --profile external-api config --quiet
      - name: Verify isolated app and core
        run: |
          docker network create dxtrace-edge
          docker network create dxtrace-private
          docker run -d --name core --network dxtrace-private -e DX_CORE_TOKEN=ci-only-not-a-production-secret-123456 -e PUBLIC_ORIGIN=http://localhost dxtrace-ci node selfhost/core-server.mjs
          docker run -d --name gateway-api --network dxtrace-private -e DX_GATEWAY_APP_TOKEN=ci-gateway-app-token-not-a-production-secret-123456 -e DX_CORE_TOKEN=ci-only-not-a-production-secret-123456 dxtrace-ci node selfhost/api-gateway.mjs
          docker network connect dxtrace-edge gateway-api
          docker run -d --name quality-portal --network dxtrace-edge dxtrace-ci node apps/quality-portal/server.mjs
          docker run -d --name app --network dxtrace-edge -e DX_CORE_TOKEN=ci-gateway-app-token-not-a-production-secret-123456 -e DX_CORE_URL=http://gateway-api:8082 -e DX_QUALITY_PORTAL_URL=http://quality-portal:8090 -e PUBLIC_ORIGIN=http://localhost dxtrace-ci
          docker exec app node selfhost/container-smoke.mjs
      - name: Container logs
        if: failure()
        run: |
          docker logs core
          docker logs gateway-api
          docker logs app
          docker logs quality-portal
      - name: Cleanup
        if: always()
        run: |
          docker rm -f app quality-portal gateway-api core || true
          docker network rm dxtrace-edge dxtrace-private || true
  postgres-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start disposable PostgreSQL
        run: |
          docker run -d --name dx-pg-ci -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          for i in $(seq 1 60); do
            if docker exec dx-pg-ci psql -h 127.0.0.1 -U postgres -d postgres -Atqc 'SELECT 1' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify migration and rollback against PostgreSQL
        env:
          DX_TEST_POSTGRES_CONTAINER: dx-pg-ci
        run: node --test tests/postgres-export.test.mjs
      - name: Cleanup
        if: always()
        run: docker rm -f dx-pg-ci || true
  isolated-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Verify low-concurrency isolated request path
        run: node tools/benchmark-platform.mjs --topology isolated --records 10000 --seconds 2 --levels 1,10 --assert-no-errors --out /tmp/dxtrace-smoke.json
      - name: Characterize isolated stack up to 200 concurrent clients
        run: node tools/benchmark-platform.mjs --topology isolated --records 10000 --seconds 3 --levels 25,50,100,200 --out /tmp/dxtrace-isolated.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-stack-benchmark
          path: /tmp/dxtrace-*.json
