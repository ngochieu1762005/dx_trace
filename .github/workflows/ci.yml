name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Check tracked source for leaked credentials
        run: node tools/check-secrets.mjs
      - name: Validate standalone portal JavaScript syntax
        run: node --check apps/quality-portal/server.mjs && node --check apps/quality-portal/app.js
      - run: node selfhost/build.mjs
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests -p '*_test.py'
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f selfhost/Dockerfile -t dxtrace-ci .
      - name: Verify isolated app and core
        run: |
          docker network create dxtrace-edge
          docker network create dxtrace-private
          docker run -d --name core --network dxtrace-private -e DX_CORE_TOKEN=ci-only-not-a-production-secret-123456 -e PUBLIC_ORIGIN=http://localhost dxtrace-ci node selfhost/core-server.mjs
          docker run -d --name gateway-api --network dxtrace-private -e DX_GATEWAY_APP_TOKEN=ci-gateway-app-token-not-a-production-secret-123456 -e DX_CORE_TOKEN=ci-only-not-a-production-secret-123456 dxtrace-ci node selfhost/api-gateway.mjs
          docker network connect dxtrace-edge gateway-api
          docker run -d --name quality-portal --network dxtrace-edge dxtrace-ci node apps/quality-portal/server.mjs
          docker run -d --name app --network dxtrace-edge -e DX_CORE_TOKEN=ci-gateway-app-token-not-a-production-secret-123456 -e DX_CORE_URL=http://gateway-api:8082 -e DX_QUALITY_PORTAL_URL=http://quality-portal:8090 -e PUBLIC_ORIGIN=http://localhost dxtrace-ci
          docker exec app node selfhost/container-smoke.mjs
      - name: Container logs
        if: failure()
        run: |
          docker logs core
          docker logs gateway-api
          docker logs app
          docker logs quality-portal
      - name: Cleanup
        if: always()
        run: |
          docker rm -f app quality-portal gateway-api core || true
          docker network rm dxtrace-edge dxtrace-private || true
