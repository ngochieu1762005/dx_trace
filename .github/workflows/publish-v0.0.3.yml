# DX-TRACE | One-time verified publication of v0.0.3
# SPDX-License-Identifier: MIT
# Triggered by its addition to main, or explicitly through workflow_dispatch.
# All release artifacts are created by GitHub Actions, never from a VPS.
name: Publish DX-TRACE v0.0.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.0.3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dxtrace-publish-v0.0.3
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean release candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and exclude private files
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')" = "0.0.3"
          test -f CHANGELOG.md
          test -f RELEASE_NOTES_v0.0.3.md
          test -f SECURITY.md
          if git ls-files | grep -Ei '(^|/)(\.env(\..*)?|node_modules|data|\.ssh)(/|$)|\.(db|sqlite|sqlite3|pem|key|p12|pfx|dump)$'; then
            echo "Refusing to release: a private/local file is Git-tracked." >&2
            exit 1
          fi
          if git grep -I -n -E '103\.77\.172\.235|Pharma[V]ision|pharmavision\.hieuds\.com' -- . ':!README.md'; then
            echo "Refusing to release: personal hosting information remains in tracked source." >&2
            exit 1
          fi

      - name: Set up Node 24 and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node selfhost/build.mjs
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests -p '*_test.py'

      - name: Create source tarball and SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz \
            --prefix=DX-TRACE-v0.0.3/ \
            -o DX-TRACE-v0.0.3.tar.gz \
            "$GITHUB_SHA"
          sha256sum DX-TRACE-v0.0.3.tar.gz > SHA256SUMS
          tar -tzf DX-TRACE-v0.0.3.tar.gz > /dev/null

      - name: Publish tag, GitHub Release, and files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.0.3 >/dev/null 2>&1; then
            echo "v0.0.3 already published; keeping existing release untouched."
            exit 0
          fi

          if gh api "repos/$GH_REPO/git/ref/tags/v0.0.3" >/dev/null 2>&1; then
            actual="$(gh api "repos/$GH_REPO/git/ref/tags/v0.0.3" --jq '.object.sha')"
            if [ "$actual" != "$GITHUB_SHA" ]; then
              echo "Tag already exists at a different SHA; refusing to publish unexpected source." >&2
              exit 1
            fi
          else
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f ref='refs/tags/v0.0.3' \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          gh release create v0.0.3 \
            --verify-tag \
            --title 'DX-TRACE v0.0.3 — Product Experience & Session Recovery' \
            --notes-file RELEASE_NOTES_v0.0.3.md \
            DX-TRACE-v0.0.3.tar.gz \
            SHA256SUMS

          gh release view v0.0.3 --json url -q .url
