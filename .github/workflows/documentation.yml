# SPDX-License-Identifier: MIT
name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r website/requirements.txt
      - run: python website/build.py --out /tmp/dxtrace-docs
      - run: python website/verify.py /tmp/dxtrace-docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/dxtrace-docs
      - uses: actions/upload-artifact@v4
        with:
          name: dxtrace-docs-preview
          path: /tmp/dxtrace-docs
          include-hidden-files: true
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
