# SPDX-License-Identifier: MIT
apiVersion: dxtrace.io/v1
kind: Application
metadata:
  name: maintenance
  version: 1.0.0
spec:
  requiresCore: ">=0.0.7 <1.0.0"
  permissions:
    - asset:read
    - asset:create
    - maintenance:read
    - maintenance:create
    - maintenance:approve
  workflows:
    - workflows/maintenance.bpmn
  schemas:
    - schemas/asset.json
    - schemas/maintenance.json
  routes:
    - path: /maintenance
      service: maintenance-portal
  audit:
    enabled: true
