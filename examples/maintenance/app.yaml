# SPDX-License-Identifier: MIT
apiVersion: dxtrace.io/v1
kind: Application
metadata:
  name: maintenance
  version: 1.1.0
spec:
  requiresCore: ">=0.2.0 <1.0.0"
  permissions:
    - asset:read
    - asset:create
    - maintenance:read
    - maintenance:create
    - maintenance:approve
  workflows:
    - workflows/maintenance.bpmn
  schemas:
    - schemas/maintenance.json
    - schemas/asset.json
  routes:
    - path: /maintenance
      service: maintenance-portal
  handover:
    provider: flowable
    resource: maintenance
    after: done
  evidence:
    signing: optional
    resources: [maintenance]
  audit:
    enabled: true
