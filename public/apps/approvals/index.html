<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DX Approvals · DX-TRACE Open-Core</title>
<link rel="icon" href="/favicon.svg"/>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17243a;background:#f4f6f8}
*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e2e7ef;padding:18px max(24px,calc((100% - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.5px}.brand span{color:#2563eb}
small,.muted{color:#64748b}.wrap{max-width:1080px;margin:40px auto;padding:0 24px}
h1{font-size:clamp(28px,5vw,42px);letter-spacing:-1px;margin:8px 0}p{line-height:1.55}
.panels{display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,2fr);gap:22px;margin-top:28px}
.card{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:24px;box-shadow:0 3px 12px #14213d08}
label{display:block;font-weight:600;font-size:13px;margin:15px 0 6px}
input,textarea{font:inherit;width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:12px;outline-color:#2563eb}textarea{min-height:110px;resize:vertical}
button,.button{font:inherit;cursor:pointer;border:0;border-radius:8px;background:#2563eb;color:white;padding:11px 16px;font-weight:650;text-decoration:none;display:inline-block}
button.secondary,.button.secondary{background:#edf2f8;color:#1f3a5c}
button:disabled{opacity:.5;cursor:not-allowed}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card h2{margin:0 0 14px;font-size:19px}.item{padding:18px 0;border-top:1px solid #eef1f5}.item h3{margin:0 0 4px;font-size:16px;overflow-wrap:anywhere}.item p{white-space:pre-wrap;margin:8px 0 12px}.tag{display:inline-block;padding:4px 9px;background:#eef2ff;border-radius:5px;font-size:12px;font-weight:700;color:#314575}
.status{min-height:22px;color:#b91c1c}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
@media(max-width:730px){header{padding:16px 20px}.wrap{margin:20px auto;padding:0 15px}.panels{grid-template-columns:1fr}.row{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<header><div class="brand">DX<span> Approvals</span> <small> / Open-Core</small></div><div class="tools"><a class="button secondary" href="/?area=training#overview">DX-TRACE Warehouse</a><button id="refresh" class="secondary">Làm mới</button></div></header>
<main class="wrap">
<div class="muted">ỨNG DỤNG 02 · QUY TRÌNH SỐ</div>
<h1>Đề xuất và phê duyệt</h1>
<p class="muted">Ứng dụng độc lập sử dụng cùng tài khoản OIDC, quyền hạn, workspace, Core API và kho dữ liệu với DX-TRACE Warehouse. Không có cơ sở dữ liệu hoặc backend riêng.</p>
<div class="tools"><label style="margin:0"><input style="width:auto" id="training" type="checkbox" checked/> Không gian thực hành</label><span id="who" class="muted"></span></div>
<div class="panels">
<section class="card"><h2>Tạo đề xuất</h2><form id="form"><label for="title">Tiêu đề</label><input id="title" maxlength="140" required/><label for="content">Nội dung</label><textarea id="content" maxlength="4000" required></textarea><p><button id="save">Tạo bản nháp</button></p></form><p class="status" id="message" role="status" aria-live="polite"></p></section>
<section class="card"><div class="row"><h2>Luồng xử lý</h2><span id="count" class="muted"></span></div><div id="items" aria-live="polite">Đang tải...</div></section>
</div>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
